name: build

on:
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - .github/workflows/reusable--*.yaml
      - Dockerfile
      - entrypoint.sh
      - e2e-test/**
      - hack/**
  push:
    paths:
      - .github/workflows/build.yaml
      - .github/workflows/reusable--*.yaml
      - Dockerfile
      - entrypoint.sh
      - e2e-test/**
      - hack/**
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/reusable--build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  e2e-test:
    needs:
      - build
    uses: ./.github/workflows/reusable--e2e-test.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: write
    with:
      runner-image-uri: ${{ needs.build.outputs.image-uri }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - e2e-test
    uses: ./.github/workflows/reusable--release.yaml
    permissions:
      contents: write
      packages: write
    with:
      runner-image-uri: ${{ needs.build.outputs.image-uri }}
