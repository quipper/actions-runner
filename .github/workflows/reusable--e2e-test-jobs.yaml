name: e2e-test-jobs

on:
  workflow_call:
    inputs:
      runner-name:
        type: string
        required: true
        description: Name of runner
      expected-image-os:
        type: string
        required: true
        description: Expected value of $ImageOS

jobs:
  assert-environment:
    runs-on: ${{ inputs.runner-name }}
    timeout-minutes: 10
    steps:
      - run: uname -a
      - run: cat /etc/os-release
      - run: test "$ImageOS" = "$expected_image_os"
        env:
          expected_image_os: ${{ inputs.expected-image-os }}
      # The pod memory limit applies to job containers only when they are under the pod cgroup.
      - name: Test docker run creates the container under the pod cgroup
        run: |
          pod_cgroup="$(dirname "$(cut -d: -f3 /proc/self/cgroup)")"
          cid="$(docker run -d debian:stable sleep 60)"
          ls -d "/sys/fs/cgroup${pod_cgroup}/${cid}"
          docker rm -f "$cid"

  test-actions:
    runs-on: ${{ inputs.runner-name }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ls -la ~/

      - run: docker version
      - run: docker run -v "$PWD:/workspace" --rm debian:stable ls -l /workspace/README.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          context: e2e-test
          file: e2e-test/fixture.dockerfile

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: 4.0.9
      - run: ruby --version
      - run: gem --version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3
      - run: python --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --version

  test-service-container:
    runs-on: ${{ inputs.runner-name }}
    timeout-minutes: 10
    services:
      http:
        image: nginx:stable
        ports:
          - 8080:80
    steps:
      - run: curl -sf http://localhost:8080
      - name: Test the service container is under the pod cgroup
        run: |
          pod_cgroup="$(dirname "$(cut -d: -f3 /proc/self/cgroup)")"
          cid="$(docker ps -q --no-trunc --filter ancestor=nginx:stable)"
          ls -d "/sys/fs/cgroup${pod_cgroup}/${cid}"
