name: release

on:
  workflow_call:
    inputs:
      runner-image-uri:
        type: string
        required: true
        description: Image URI of runner

jobs:
  tag-runner-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Do not run concurrently to avoid overwriting the tag by an older image
    concurrency:
      group: ${{ github.workflow }}--tag-runner-version
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: get-runner-version
        run: bash hack/get-runner-version.sh
        env:
          RUNNER_IMAGE_URI: ${{ inputs.runner-image-uri }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add the runner version tag to the tested image without rebuild
      - run: docker buildx imagetools create -t "ghcr.io/${GITHUB_REPOSITORY}:${RUNNER_VERSION}" "$RUNNER_IMAGE_URI"
        env:
          RUNNER_VERSION: ${{ steps.get-runner-version.outputs.runner-version }}
          RUNNER_IMAGE_URI: ${{ inputs.runner-image-uri }}

      # When Renovate has updated the runner version,
      # create a new release into GitHub Releases.
      - run: bash hack/create-release-if-not-exists.sh
        env:
          RUNNER_VERSION: ${{ steps.get-runner-version.outputs.runner-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
