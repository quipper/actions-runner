name: e2e-test

on:
  workflow_call:
    inputs:
      runner-image-uri:
        type: string
        required: true
        description: Image URI of runner

concurrency:
  # One workflow run per a pull request or pushed branch
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-name:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      runner-name: ${{ steps.generate.outputs.runner-name }}
    steps:
      # Generate a random name to isolate the runner scale set from other workflows
      - id: generate
        run: echo "runner-name=e2e-${GITHUB_RUN_ID}-$(openssl rand -hex 8)" >> "$GITHUB_OUTPUT"

  controller:
    needs: runner-name
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: e2e-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
          working_directory: e2e-test
      - run: make cluster
      - run: make create-github-config-secret
        env:
          APP_ID: ${{ secrets.E2E_TEST_APP_ID }}
          APP_INSTALLATION_ID: ${{ secrets.E2E_TEST_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.E2E_TEST_APP_PRIVATE_KEY }}
      - run: make controller

      - run: make runner-scale-set
        env:
          ARC_RUNNER_NAME: ${{ needs.runner-name.outputs.runner-name }}
          ARC_RUNNER_IMAGE_URI: ${{ inputs.runner-image-uri }}

      - run: make wait-for-runner
        env:
          ARC_RUNNER_NAME: ${{ needs.runner-name.outputs.runner-name }}
      - run: make runner-logs
        if: always()
      - run: make listener-logs
        if: always()
      - run: make undeploy
        if: always()
      - run: make controller-logs
        if: always()

  finally-cancel-workflow-run:
    needs: controller
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })

  runner-latest:
    needs: runner-name
    uses: ./.github/workflows/reusable--e2e-test-jobs.yaml
    with:
      runner-name: ${{ needs.runner-name.outputs.runner-name }}
      expected-image-os: ubuntu24
